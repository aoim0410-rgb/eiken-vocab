<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>準1級 Vocabulary Master</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 6px}.sub{color:#666;margin-bottom:22px}
.card{background:white;border:1px solid #e3e5ea;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #00000008}
.menu{display:grid;gap:12px}.menu button{font-size:19px;padding:20px;border:0;border-radius:15px;background:#171717;color:white}
button{font:inherit;cursor:pointer}.secondary{background:#eee!important;color:#222!important}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:12px;color:#777}
.q{font-size:31px;font-weight:750;margin:25px 0;text-align:center}.opts{display:grid;gap:10px}
.opt{border:1px solid #ddd;background:#fff;border-radius:13px;padding:14px;text-align:left;min-height:54px}
.opt:disabled{opacity:1}.correct{outline:3px solid #58a86a}.wrong{outline:3px solid #d95c5c}
.feedback{min-height:28px;text-align:center;font-weight:700;margin:12px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:12px}.actions button{padding:10px 13px;border:0;border-radius:11px;background:#eee}
.star{font-size:23px;border:0;background:none}.hidden{display:none}
.progress{height:6px;background:#e8e8e8;border-radius:5px;overflow:hidden}.bar{height:100%;width:0;background:#222}
.result{text-align:center}.big{font-size:42px;font-weight:800}.wordrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0;gap:10px}
.wordrow .en{font-weight:700}.tag{font-size:11px;color:#777}
@media(max-width:500px){.q{font-size:27px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<script>
const VOCAB = [{en:'concrete',ja:'具体的な'},{en:'exception',ja:'例外'},{en:'row',ja:'列'},{en:'apparent',ja:'明らかな、一見〜らしい'},{en:'breed',ja:'繁殖する、品種'},{en:'fault',ja:'欠点、過失、責任'},{en:'admire',ja:'賞賛する、尊敬する'},{en:'conservation',ja:'保護、保全'},{en:'intense',ja:'激しい、強烈な'},{en:'rational',ja:'合理的な、理性的な'},{en:'witness',ja:'目撃者、目撃する'},{en:'register',ja:'登録する、登録'},{en:'poverty',ja:'貧困'},{en:'organism',ja:'生物'},{en:'warehouse',ja:'倉庫'},{en:'overlook',ja:'見落とす、大目に見る'},{en:'destination',ja:'目的地'},{en:'qualified',ja:'資格のある、適任の'},{en:'former',ja:'以前の、前者'},{en:'livestock',ja:'家畜'},{en:'fancy',ja:'高級な、好む'},{en:'approve',ja:'承認する'},{en:'lawsuit',ja:'訴訟'},{en:'placement',ja:'配置、就職先'},{en:'altogether',ja:'完全に、全部で'},{en:'comprehend',ja:'理解する'},{en:'congress',ja:'議会'},{en:'unprecedented',ja:'前例のない'},{en:'destiny',ja:'運命'},{en:'subsequent',ja:'その後の'},{en:'commodity',ja:'商品、日用品'},{en:'diagnose',ja:'診断する'},{en:'bump',ja:'ぶつかる、こぶ'},{en:'inherent',ja:'固有の、生まれつき備わった'},{en:'mill',ja:'工場、製粉所'},{en:'expedition',ja:'探検、遠征'},{en:'indispensable',ja:'不可欠な'},{en:'remark',ja:'発言、述べる'},{en:'interior',ja:'内部、内側の'},{en:'excess',ja:'過剰'},{en:'spatial',ja:'空間の'},{en:'curse',ja:'呪い、悪態'},{en:'thorough',ja:'徹底的な'},{en:'weave',ja:'織る'},{en:'manual',ja:'手動の、説明書'},{en:'strip',ja:'細長い一片、取り除く'},{en:'indifferent',ja:'無関心な'},{en:'bind',ja:'結びつける、縛る'},{en:'comprise',ja:'構成する、含む'},{en:'antibiotic',ja:'抗生物質'},{en:'quote',ja:'引用する、引用'},{en:'faith',ja:'信頼、信仰'},{en:'tomb',ja:'墓'},{en:'compassion',ja:'思いやり、同情'},{en:'herd',ja:'群れ'},{en:'magnificent',ja:'壮大な、素晴らしい'},{en:'induce',ja:'引き起こす、誘発する'},{en:'orient',ja:'方向づける、適応させる'},{en:'fraction',ja:'一部、分数'},{en:'acquaintance',ja:'知人、知識'},{en:'constitute',ja:'構成する、制定する'},{en:'sake',ja:'ため、目的'},{en:'impose',ja:'課す'},{en:'landmine',ja:'地雷'},{en:'census',ja:'国勢調査、人口調査'},{en:'drift',ja:'漂流する、漂う'},{en:'spectrum',ja:'範囲、スペクトル'},{en:'innate',ja:'生まれつきの'},{en:'static',ja:'静的な、動かない'},{en:'asteroid',ja:'小惑星'},{en:'valid',ja:'有効な、妥当な'},{en:'modest',ja:'控えめな、適度な'},{en:'criterion',ja:'基準'},{en:'encyclopedia',ja:'百科事典'},{en:'inclined',ja:'〜する傾向がある、傾いた'},{en:'tragedy',ja:'悲劇'},{en:'assemble',ja:'組み立てる、集める'},{en:'parliament',ja:'議会'},{en:'descend',ja:'下降する、下る'},{en:'competent',ja:'有能な、適任の'},{en:'collision',ja:'衝突'},{en:'outlook',ja:'見通し、見解'},{en:'legislation',ja:'法律、法制'},{en:'optimistic',ja:'楽観的な'},{en:'neuron',ja:'ニューロン、神経細胞'},{en:'illusion',ja:'錯覚、幻想'},{en:'prospect',ja:'見込み、展望'},{en:'flee',ja:'逃げる'},{en:'keen',ja:'熱心な、鋭い'},{en:'suspend',ja:'一時停止する、吊るす'},{en:'strive',ja:'努力する'},{en:'profound',ja:'深い、重大な'},{en:'retreat',ja:'退く、退却'},{en:'attain',ja:'達成する'},{en:'qualify',ja:'資格を得る、適格にする'},{en:'utility',ja:'有用性、公共事業'},{en:'asset',ja:'資産、強み'},{en:'estate',ja:'財産、土地'},{en:'microbe',ja:'微生物'},{en:'simultaneously',ja:'同時に'},{en:'dignity',ja:'尊厳'},{en:'tempt',ja:'誘惑する'},{en:'prominent',ja:'著名な、目立つ'},{en:'posture',ja:'姿勢'},{en:'intuition',ja:'直感'},{en:'integrate',ja:'統合する'},{en:'probable',ja:'ありそうな'},{en:'flock',ja:'群れ'},{en:'log',ja:'記録する、丸太'},{en:'consensus',ja:'合意'},{en:'compensate',ja:'補償する、埋め合わせる'},{en:'compromise',ja:'妥協、妥協する'},{en:'demographic',ja:'人口統計の'},{en:'grateful',ja:'感謝している'},{en:'shade',ja:'日陰、色合い'},{en:'sensation',ja:'感覚、感情'},{en:'extract',ja:'抽出する、抜き出す'},{en:'anticipate',ja:'予想する、期待する'},{en:'quest',ja:'探求、探索'},{en:'acute',ja:'深刻な、急性の'},{en:'reef',ja:'礁、岩礁'},{en:'generous',ja:'寛大な、気前のよい'},{en:'moderate',ja:'適度な、穏健な'},{en:'deprive',ja:'奪う'},{en:'drag',ja:'引きずる'},{en:'county',ja:'郡'},{en:'monetary',ja:'金銭の、金融の'},{en:'confront',ja:'直面する'},{en:'superficial',ja:'表面的な'},{en:'infer',ja:'推測する、推論する'},{en:'external',ja:'外部の'},{en:'soar',ja:'急上昇する、高く舞い上がる'},{en:'remedy',ja:'治療法、改善策'},{en:'indigenous',ja:'固有の、先住の'},{en:'aesthetic',ja:'美的な'},{en:'consent',ja:'同意、同意する'},{en:'enterprise',ja:'企業、事業'},{en:'offspring',ja:'子、子孫'},{en:'deliberate',ja:'故意の、慎重に考える'},{en:'behalf',ja:'〜を代表して'},{en:'humor',ja:'ユーモア、機嫌を取る'},{en:'partial',ja:'部分的な、偏った'},{en:'transition',ja:'移行、変化'},{en:'trail',ja:'小道、跡、引きずる'},{en:'faculty',ja:'能力、学部'},{en:'sensible',ja:'分別のある、賢明な'},{en:'transaction',ja:'取引'},{en:'molecule',ja:'分子'},{en:'ambiguous',ja:'曖昧な'},{en:'outlet',ja:'出口、販売店、はけ口'},{en:'collective',ja:'集団の、共同の'},{en:'retrieve',ja:'取り戻す'},{en:'superstitious',ja:'迷信深い'},{en:'lengthy',ja:'長時間にわたる、長い'},{en:'solitary',ja:'孤独な、たった一つの'},{en:'uneven',ja:'平らでない、不均一な'},{en:'procession',ja:'行列、行進'},{en:'dictator',ja:'独裁者'},{en:'overate',ja:'食べ過ぎた'},{en:'notably',ja:'特に、著しく'},{en:'broad',ja:'幅広い'},{en:'unauthorized',ja:'無許可の'},{en:'wilderness',ja:'荒野'},{en:'crust',ja:'地殻、外皮'},{en:'janitor',ja:'管理人、用務員'},{en:'landfill',ja:'埋立地'},{en:'excessive',ja:'過度の'},{en:'currency',ja:'通貨'},{en:'appliance',ja:'電化製品、器具'},{en:'circuit',ja:'回路、巡回'},{en:'celebrity',ja:'有名人'},{en:'implement',ja:'実行する、道具'},{en:'Mediterranean',ja:'地中海の、地中海'},{en:'expectancy',ja:'予想、期待、平均余命'},{en:'dock',ja:'波止場、埠頭'},{en:'inflammation',ja:'炎症'},{en:'description',ja:'説明、描写'},{en:'commission',ja:'委員会、手数料、依頼する'},{en:'relieve',ja:'和らげる、解放する'},{en:'mandatory',ja:'義務的な'},{en:'outstanding',ja:'傑出した、未払いの'},{en:'deadly',ja:'致命的な'},{en:'substantial',ja:'かなりの、実質的な'},{en:'closure',ja:'閉鎖、終了'},{en:'substitute',ja:'代用品、代わりに使う'},{en:'auditorium',ja:'講堂、ホール'},{en:'comfort',ja:'慰め、快適さ、慰める'},{en:'gut',ja:'腸、直感、内臓を取り除く'}];
let mode=null, queue=[], pos=0, score=0, answered=0, current=null, locked=false, timer=null;
let checked = JSON.parse(localStorage.getItem("vocab_checked")||"[]");
let historyWrong = JSON.parse(localStorage.getItem("vocab_wrong")||"[]");

function save(){localStorage.setItem("vocab_checked",JSON.stringify(checked));localStorage.setItem("vocab_wrong",JSON.stringify(historyWrong));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function byEn(en){return VOCAB.find(x=>x.en===en)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function menu(){
 clearInterval(timer);
 app.innerHTML=`<h1>準1級 Vocabulary Master</h1><div class="sub">${VOCAB.length}語・4セクション総合</div>
 <div class="menu">
 <button onclick="startPractice()">練習モード</button>
 <button onclick="startTest()">テストモード</button>
 <button onclick="checkWords()">要チェックワード集</button>
 </div>
 <div class="card small">練習モード：1周するまで同じ問題は出ません。正答率は小さく表示され、無限に続きます。<br>チェックは★ボタンから。チェックと間違い履歴はこの端末に保存されます。</div>`;
}
function makeQuestion(){
 let correct=queue[pos];
 let others=shuffle(VOCAB.filter(x=>x.en!==correct.en)).slice(0,3);
 let opts=shuffle([correct,...others]);
 return {correct,opts};
}
function startPractice(){
 mode="practice"; queue=shuffle(VOCAB);pos=0;score=0;answered=0;nextPractice();
}
function nextPractice(){
 if(pos>=queue.length){queue=shuffle(VOCAB);pos=0;}
 current=makeQuestion();locked=false;renderPractice();
}
function renderPractice(){
 let c=current.correct;
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← メニュー</button><span class="small">正答率 ${answered?Math.round(score/answered*100):100}%</span></div>
 <div class="card"><div class="top"><span class="tag">${pos+1}/${queue.length}</span><button class="star" onclick="toggleCheck('${c.en}')" title="要チェック">★</button></div>
 <div class="q">${esc(c.en)}</div><div class="opts">${current.opts.map((o,i)=>`<button class="opt" onclick="answerPractice(${i})">${esc(o.ja)}</button>`).join("")}</div>
 <div id="fb" class="feedback"></div></div>`;
}
function answerPractice(i){
 if(locked)return;locked=true;answered++;
 let ok=current.opts[i].en===current.correct.en;if(ok)score++;else if(!historyWrong.includes(current.correct.en))historyWrong.push(current.correct.en);
 save();
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(current.opts[j].en===current.correct.en)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});
 document.getElementById("fb").textContent=ok?"○ 正解！":"× 正解： "+current.correct.ja;
 setTimeout(()=>{pos++;nextPractice()},550);
}
function toggleCheck(en){
 let i=checked.indexOf(en); if(i>=0)checked.splice(i,1);else checked.push(en);save();
}
function startTest(){
 mode="test";queue=shuffle(VOCAB).slice(0,30);pos=0;score=0;answered=0;testNext();
}
function testNext(){
 if(pos>=30){testResult();return}
 current=makeQuestion();locked=false;renderTest();let left=5;
 document.getElementById("timer").textContent=left;
 clearInterval(timer);timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);answerTest(-1)}},1000);
}
function renderTest(){
 let c=current.correct;
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← 中止</button><span>第${pos+1}/30問　残り <b id="timer">5</b>秒</span></div>
 <div class="progress"><div class="bar" style="width:${pos/30*100}%"></div></div>
 <div class="card"><div class="q">${esc(c.en)}</div><div class="opts">${current.opts.map((o,i)=>`<button class="opt" onclick="answerTest(${i})">${esc(o.ja)}</button>`).join("")}</div></div>`;
}
function answerTest(i){
 if(locked)return;locked=true;clearInterval(timer);answered++;
 let ok=i>=0&&current.opts[i].en===current.correct.en;if(ok)score++;else if(!historyWrong.includes(current.correct.en))historyWrong.push(current.correct.en);
 save();pos++;setTimeout(testNext,80);
}
function testResult(){
 clearInterval(timer);let pct=Math.round(score/30*100);
 app.innerHTML=`<div class="card result"><h2>テスト終了</h2><div class="big">${score} / 30</div><p>${pct}%</p>
 <button onclick="startTest()">もう一度</button> <button class="secondary" onclick="menu()">メニューへ</button></div>`;
}
function checkWords(){
 let set=new Set([...checked,...historyWrong]);
 let arr=[...set].map(byEn).filter(Boolean);
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← メニュー</button><b>要チェックワード集</b></div>
 <div class="card"><div class="small">★自分でチェック：${checked.length}語 ／ 間違い履歴：${historyWrong.length}語</div>
 ${arr.length?arr.map(x=>`<div class="wordrow"><div><span class="en">${esc(x.en)}</span><div class="small">${esc(x.ja)}</div></div><button class="star" onclick="toggleCheck('${x.en}');checkWords()">★</button></div>`).join(""):`<p>まだありません。練習モードで★を付けたり、間違えたりするとここに追加されます。</p>`}</div>
 <button class="secondary" onclick="if(confirm('間違い履歴を消しますか？')){historyWrong=[];save();checkWords()}">間違い履歴をリセット</button>`;
}
menu();
</script>
</body>
</html>
