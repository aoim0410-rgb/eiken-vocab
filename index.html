function etymologyFor(word){ return ETYMOLOGY[word] || ''; }
function wordInfo(word){
 const item=VOCAB.find(v=>v.en===word)||{ja:''};
 return {meaning:item.ja, ipa:IPA[word]||'', etymology:etymologyFor(word)};
}

function menu(){
 clearInterval(timer);
 app.innerHTML=`<h1>準1級 Vocabulary Master</h1><div class="sub">${VOCAB.length}語・4セクション総合</div>
 <div class="menu">
 <button onclick="startPractice()">練習モード</button>
 <button onclick="startTest()">テストモード</button>
 <button onclick="checkWords()">要チェックワード集</button>
 </div>
 <div class="card small">練習モード：1周するまで同じ問題は出ません。正答率は小さく表示され、無限に続きます。<br>チェックは★ボタンから。チェックと間違い履歴はこの端末に保存されます。</div>`;
}
function makeQuestion(){
 let correct=queue[pos];
 let others=shuffle(VOCAB.filter(x=>x.en!==correct.en)).slice(0,3);
 let opts=shuffle([correct,...others]);
 return {correct,opts};
}
function startPractice(){
 mode="practice"; queue=shuffle(VOCAB);pos=0;score=0;answered=0;nextPractice();
}
function nextPractice(){
 if(pos>=queue.length){queue=shuffle(VOCAB);pos=0;}
 current=makeQuestion();locked=false;renderPractice();
}
function renderPractice(){
 let c=current.correct;
 let pct=Math.round((pos/queue.length)*100);
 let isChecked=checked.includes(c.en);
 let face=previousResult===true?"🥳":previousResult===false?"😢":"🤖";
 let info=previousQuestion?wordInfo(previousQuestion):null;
 let coachText=info
   ? `<div><b>${esc(previousQuestion)}</b></div><div>意味：${esc(info.meaning)}</div><div>IPA：${esc(info.ipa)}</div>${info.etymology?`<div>語源：${esc(info.etymology)}</div>`:""}`
   : "一個前の問題の意味・IPAをここで確認！語源は載っている単語だけ表示するよ。";
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← メニュー</button><span class="small">正答率 ${answered?Math.round(score/answered*100):100}%</span></div>
 <div class="card"><div class="top"><span class="tag">${pos+1}/${queue.length}</span>
 <button class="star ${isChecked?"checked":""}" onclick="toggleCheck('${c.en}')" title="要チェック">${isChecked?"★":"☆"}</button></div>
 <div class="practice-progress"><div class="small">この周の進み具合　${pos}/${queue.length}</div>
 <div class="progress"><div class="bar" style="width:${pct}%"></div></div></div>
 <div class="q">${esc(c.en)}</div>
 <div class="opts">${current.opts.map((o,i)=>`<button class="opt" onclick="answerPractice(${i})">${esc(o.ja)}</button>`).join("")}</div>
 <div id="fb" class="feedback"></div>
 <div class="coach"><div class="coach-face">${face}</div><div class="coach-text">${coachText}</div></div>
 </div>`;
}
function answerPractice(i){
 if(locked)return;
 locked=true;
 answered++;
 let ok=current.opts[i].en===current.correct.en;
 if(ok)score++;
 else if(!historyWrong.includes(current.correct.en))historyWrong.push(current.correct.en);
 previousQuestion=current.correct.en;
 previousResult=ok;
 save();
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(current.opts[j].en===current.correct.en)b.classList.add("correct");if(j===i&&!ok)b.classList.add("wrong")});
 document.getElementById("fb").textContent=ok?"○ 正解！":"× 正解： "+current.correct.ja;
 setTimeout(()=>{pos++;nextPractice()},550);
}
function toggleCheck(en){
 let i=checked.indexOf(en);
 if(i>=0) checked.splice(i,1); else checked.push(en);
 save();
 if(mode==="practice") renderPractice();
}
function startTest(){
 mode="test";queue=shuffle(VOCAB).slice(0,30);pos=0;score=0;answered=0;testNext();
}
function testNext(){
 if(pos>=30){testResult();return}
 current=makeQuestion();locked=false;renderTest();let left=5;
 document.getElementById("timer").textContent=left;
 clearInterval(timer);timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);answerTest(-1)}},1000);
}
function renderTest(){
 let c=current.correct;
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← 中止</button><span>第${pos+1}/30問　残り <b id="timer">5</b>秒</span></div>
 <div class="progress"><div class="bar" style="width:${pos/30*100}%"></div></div>
 <div class="card"><div class="q">${esc(c.en)}</div><div class="opts">${current.opts.map((o,i)=>`<button class="opt" onclick="answerTest(${i})">${esc(o.ja)}</button>`).join("")}</div></div>`;
}
function answerTest(i){
 if(locked)return;locked=true;clearInterval(timer);answered++;
 let ok=i>=0&&current.opts[i].en===current.correct.en;if(ok)score++;else if(!historyWrong.includes(current.correct.en))historyWrong.push(current.correct.en);
 save();pos++;setTimeout(testNext,80);
}
function testResult(){
 clearInterval(timer);let pct=Math.round(score/30*100);
 app.innerHTML=`<div class="card result"><h2>テスト終了</h2><div class="big">${score} / 30</div><p>${pct}%</p>
 <button onclick="startTest()">もう一度</button> <button class="secondary" onclick="menu()">メニューへ</button></div>`;
}
function checkWords(){
 let set=new Set([...checked,...historyWrong]);
 let arr=[...set].map(byEn).filter(Boolean);
 app.innerHTML=`<div class="top"><button class="secondary" onclick="menu()">← メニュー</button><b>要チェックワード集</b></div>
 <div class="card"><div class="small">★自分でチェック：${checked.length}語 ／ 間違い履歴：${historyWrong.length}語</div>
 ${arr.length?arr.map(x=>`<div class="wordrow"><div><span class="en">${esc(x.en)}</span><div class="small">${esc(x.ja)}</div></div><button class="star" onclick="toggleCheck('${x.en}');checkWords()">★</button></div>`).join(""):`<p>まだありません。練習モードで★を付けたり、間違えたりするとここに追加されます。</p>`}</div>
 <button class="secondary" onclick="if(confirm('間違い履歴を消しますか？')){historyWrong=[];save();checkWords()}">間違い履歴をリセット</button>`;
}
menu();
</script>
